  <path d="M 46,20 L 514,20 Q 539,20 539,45 L 539,542 L 280,668 L 21,542 L 21,45 Q 21,20 46,20 Z" fill="none" stroke="#DFBE6A" stroke-width="2.5" stroke-opacity="0.65"/>

